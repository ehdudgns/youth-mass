[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/songs/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/rosary/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/mass/*"
  [headers.values]
    Cache-Control = "no-cache"

