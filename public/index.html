<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청년미사 도우미</title>
<meta name="description" content="주일 청년미사 순서, 성가 번호, 묵주기도 도우미">
<meta property="og:title" content="청년미사 도우미">
<meta property="og:description" content="주일 미사 순서와 성가, 묵주기도를 한곳에서">
<meta name="theme-color" content="#2f3a56">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝</text></svg>">
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2a33; --muted:#7b7469; --line:#e7dfd1;
    --navy:#2f3a56; --gold:#b08d4a; --gold-soft:#f3ead7;
    --r:18px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.5; min-height:100dvh}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  header{text-align:center;padding:18px 0 8px}
  header .cross{color:var(--gold);font-size:26px;letter-spacing:4px}
  header h1{margin:6px 0 4px;font-size:26px;color:var(--navy);font-weight:800;letter-spacing:-.5px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .date-chip{display:inline-block;margin-top:14px;background:var(--gold-soft);color:var(--navy);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
  .cards{display:flex;flex-direction:column;gap:14px;margin-top:22px}
  .card, a.card{display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;
    box-shadow:0 2px 10px rgba(47,58,86,.05);transition:transform .15s, box-shadow .15s}
  a.card:active{transform:scale(.98)}
  a.card:hover, .card:hover{box-shadow:0 4px 16px rgba(47,58,86,.1)}
  .card .emoji{font-size:28px;line-height:1}
  .card h2{margin:8px 0 4px;font-size:20px;color:var(--navy);letter-spacing:-.3px}
  .card .desc{margin:0;color:var(--muted);font-size:14px}
  .preview{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .preview .label{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.5px;margin-bottom:6px}
  .preview .when{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:8px}
  .preview .rows{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .preview .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    background:var(--bg);border-radius:10px;padding:8px 10px}
  .preview .k{font-size:13px;color:var(--muted);font-weight:600}
  .preview .v{font-size:18px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .preview .empty{color:var(--muted);font-size:13px}
  .preview .loading{color:var(--muted);font-size:13px}
  .arrow{float:right;color:var(--gold);font-size:18px;margin-top:2px}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:32px}
  .edit-link{display:block;margin-top:14px;text-align:center;text-decoration:none;
    background:var(--gold);color:#fff;font-weight:800;font-size:15px;padding:12px 14px;
    border-radius:12px;box-shadow:0 3px 12px rgba(176,141,74,.3)}
  .edit-link:active{transform:scale(.98)}
</style>
<script>
  // Backward compat: old #edit / #admin (and any query) → /songs/
  (function () {
    var h = location.hash;
    var q = location.search;
    if (h === "#edit" || h === "#admin" || /[?&](edit|admin)=/.test(q)) {
      location.replace("/songs/" + q + h);
    }
  })();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="cross">✝</div>
    <h1>청년미사 도우미</h1>
    <p>주일 미사 순서와 성가, 묵주기도를 한곳에서</p>
    <div class="date-chip" id="dateChip">날짜 확인 중…</div>
  </header>

  <div class="cards">
    <a class="card" href="/mass/">
      <span class="arrow">→</span>
      <div class="emoji">🕊️</div>
      <h2>주일 미사 순서</h2>
      <p class="desc">청년미사 전례 순서와 이번 주 성가 번호</p>
    </a>

    <div class="card" style="padding:0;overflow:hidden">
      <a href="/songs/" style="display:block;text-decoration:none;color:inherit;padding:20px 18px 8px">
        <span class="arrow">→</span>
        <div class="emoji">🎶</div>
        <h2>이번 주 성가</h2>
        <p class="desc">입당·봉헌·성체·파견 번호와 카톡 복사</p>
        <div class="preview" id="songPreview">
          <div class="loading">성가 불러오는 중…</div>
        </div>
      </a>
      <div style="padding:0 18px 18px">
        <a class="edit-link" href="/songs/#edit">✏️ 성가 입력하기</a>
      </div>
    </div>

    <a class="card" href="/rosary/">
      <span class="arrow">→</span>
      <div class="emoji">📿</div>
      <h2>묵주기도 도우미</h2>
      <p class="desc">한 알씩 넘기며 따라 바치는 기도</p>
    </a>
  </div>

  <footer>청년미사를 위한 작은 도우미예요</footer>
</div>

<script>
(() => {
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const FIELDS = [["entrance", "입당"], ["offertory", "봉헌"], ["communion", "성체"], ["recessional", "파견"]];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function seoulToday() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }
  function parseYMD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function fmtYMD(dt) { return dt.toISOString().slice(0, 10); }
  function comingSunday() {
    const t = parseYMD(seoulToday());
    const add = (7 - t.getUTCDay()) % 7;
    t.setUTCDate(t.getUTCDate() + add);
    return fmtYMD(t);
  }
  function longDate(s) {
    const d = parseYMD(s);
    return `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일 (${DOW[d.getUTCDay()]})`;
  }

  const today = seoulToday();
  const sun = comingSunday();
  const chip = document.getElementById("dateChip");
  if (today === sun) {
    chip.textContent = `오늘 · ${longDate(today)} 주일`;
  } else {
    chip.textContent = `오늘 ${longDate(today)} · 다가오는 주일 ${longDate(sun)}`;
  }

  function currentMass(masses) {
    const asc = [...masses].sort((a, b) => a.date.localeCompare(b.date));
    return asc.find((m) => m.date >= today) || asc[asc.length - 1] || null;
  }

  const box = document.getElementById("songPreview");
  fetch("/api/data")
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      const m = currentMass(data.masses || []);
      if (!m) {
        box.innerHTML = `<div class="empty">아직 등록된 성가가 없어요</div>`;
        return;
      }
      const label = m.date === today ? "오늘 미사" : m.date > today ? "이번 미사" : "최근 미사";
      const rows = FIELDS.map(([k, n]) => {
        const nums = (m[k] || []).join(", ") || "–";
        return `<div class="row"><span class="k">${n}</span><span class="v">${esc(nums)}</span></div>`;
      }).join("");
      box.innerHTML = `
        <div class="label">${label}</div>
        <div class="when">${esc(longDate(m.date))}</div>
        <div class="rows">${rows}</div>`;
    })
    .catch(() => {
      box.innerHTML = `<div class="empty">미리보기를 불러오지 못했어요 · 눌러서 확인하세요</div>`;
    });
})();
</script>
</body>
</html>
