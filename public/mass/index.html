<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주일 청년미사 순서</title>
<meta name="description" content="주일 청년미사 순서와 이번 주 성가 번호">
<meta property="og:title" content="주일 청년미사 순서">
<meta property="og:description" content="전례부와 성가대를 위한 주일 미사 안내">
<meta name="theme-color" content="#2f3a56">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝</text></svg>">
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2a33; --muted:#7b7469; --line:#e7dfd1;
    --navy:#2f3a56; --gold:#b08d4a; --gold-soft:#f3ead7;
    --r:18px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.55; min-height:100dvh}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
  .backnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
  .backnav a{color:var(--navy);text-decoration:none;font-weight:700;font-size:14px;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
  header{text-align:center;padding:10px 0 6px}
  header .cross{color:var(--gold);font-size:22px;letter-spacing:4px}
  header h1{margin:6px 0 4px;font-size:24px;color:var(--navy);font-weight:800;letter-spacing:-.5px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .date-chip,.song-chip{display:inline-block;margin-top:10px;background:var(--gold-soft);color:var(--navy);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
  .song-chip{display:block;width:fit-content;margin:8px auto 0;background:var(--card);border:1px solid var(--line);font-weight:600}
  .song-chip.muted{color:var(--muted);font-weight:500}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .order{margin-top:16px}
  details.section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:12px;box-shadow:0 2px 10px rgba(47,58,86,.05);overflow:hidden}
  details.section summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;
    justify-content:space-between;align-items:center;gap:8px;user-select:none}
  details.section summary::-webkit-details-marker{display:none}
  .sec-title{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  details.section summary::after{content:"▾";color:var(--gold);font-size:16px;transition:transform .2s}
  details.section[open] summary::after{transform:rotate(180deg)}
  .sec-body{padding:0 14px 14px;border-top:1px dashed var(--line)}
  .step{padding:14px 4px 12px;border-bottom:1px dashed var(--line)}
  .step:last-child{border-bottom:0;padding-bottom:2px}
  .step-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 10px}
  .step h3{margin:0;font-size:16px;color:var(--ink);font-weight:800;letter-spacing:-.2px}
  .roles{display:flex;flex-wrap:wrap;gap:4px}
  .role{font-size:11px;font-weight:700;color:var(--navy);background:var(--gold-soft);
    border-radius:999px;padding:2px 8px;letter-spacing:.02em}
  .hymns{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .hymn{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px;
    min-width:96px;flex:1 1 auto;max-width:100%}
  .hymn-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .hymn-num{display:block;font-size:30px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;
    letter-spacing:-.5px;line-height:1.15}
  .hymn-num.empty{color:#c8bfae;font-size:22px;font-weight:700}
  .resp{margin:8px 0 0;padding:10px 12px;background:var(--bg);border-radius:12px;
    font-size:14px;color:var(--navy);white-space:normal;line-height:1.6}
  .note{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .source{margin:18px 8px 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
  footer .links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
  footer a{color:var(--navy);text-decoration:none;font-weight:700;font-size:14px;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
  @media (min-width:640px){
    header h1{font-size:26px}
    .hymn-num{font-size:32px}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="backnav">
    <a href="/">← 메인</a>
    <a href="/songs/">🎶 이번 주 성가</a>
    <a href="/rosary/">📿 묵주기도</a>
  </nav>
  <main id="app"><div class="loading">불러오는 중…</div></main>
  <footer>
    <div class="links">
      <a href="/">← 메인</a>
      <a href="/songs/">🎶 성가</a>
      <a href="/rosary/">📿 묵주기도</a>
    </div>
  </footer>
</div>
<script type="module" src="./mass.js"></script>
</body>
</html>
